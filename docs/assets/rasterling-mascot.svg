  <g stroke="#182A35" stroke-width="7" stroke-linejoin="round">
    <rect x="428" y="193" width="32" height="32" rx="5" fill="#FFBF49" transform="rotate(12 444 209)"/>
    <rect x="458" y="252" width="31" height="31" rx="5" fill="#EE7E94" transform="rotate(-9 474 268)"/>
    <rect x="421" y="312" width="30" height="30" rx="5" fill="#7E78D8" transform="rotate(14 436 327)"/>
  </g>
