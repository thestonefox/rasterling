name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            elixir: '1.16'
            otp: '26'
          - os: ubuntu-24.04
            elixir: '1.18'
            otp: '27'
          - os: ubuntu-24.04
            elixir: '1.20'
            otp: '28'
          - os: windows-2022
            elixir: '1.20'
            otp: '28'
    runs-on: ${{ matrix.os }}
    env:
      CC: rasterling_native_build_disabled
      CXX: rasterling_native_build_disabled
      MAKE: rasterling_native_build_disabled
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      - uses: erlef/setup-beam@5304e04ea2b355f03681464e683d92e3b2f18451 # v1.18.2
        with:
          elixir-version: ${{ matrix.elixir }}
          otp-version: ${{ matrix.otp }}
      - run: mix compile --warnings-as-errors
      - run: mix format --check-formatted
      - run: mix test --warnings-as-errors
      - run: mix hex.build

  macos:
    runs-on: macos-latest
    env:
      CC: rasterling_native_build_disabled
      CXX: rasterling_native_build_disabled
      MAKE: rasterling_native_build_disabled
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      - name: Install Elixir
        run: brew install elixir
      - run: mix local.hex --force
      - run: mix compile --warnings-as-errors
      - run: mix format --check-formatted
      - run: mix test --warnings-as-errors
      - run: mix hex.build
